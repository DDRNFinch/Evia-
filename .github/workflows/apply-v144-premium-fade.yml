name: Apply Evia v144 premium menu fade

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Protect approved app behaviour
        run: |
          test "$(git hash-object assets/evia-staged-evidence-v132.css)" = "d4f040b3be38c59d36f25f0c8e39525119011227"
          test "$(git hash-object assets/evia-staged-evidence-v132.js)" = "31e544a5ccd5b009efe652ecadec1bcd13b5dcc5"
          test "$(git hash-object assets/evia-stage-save-v139.js)" = "72c4f3c6dca2b88fe4b14b804ece2441ab81cb89"
          test "$(git hash-object assets/evia-photo-fast-v140.js)" = "da8b78b029069280f6b734afb5c33b5d1bd5bcc4"
      - name: Wire v144 fade only
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('index.html'); s=p.read_text()
          s=s.replace('name="evia-app-version" content="143"','name="evia-app-version" content="144"')
          s=s.replace('./assets/evia-version-v143.js?v=143','./assets/evia-version-v144.js?v=144')
          s=s.replace('./assets/evia-menu-fade-v143.js?v=143','./assets/evia-menu-fade-v144.js?v=144')
          s=s.replace('./assets/evia-updater.js?v=143','./assets/evia-updater.js?v=144')
          p.write_text(s)
          for name in ['sw.js','public/sw.js']:
              p=Path(name); s=p.read_text()
              s=s.replace('// Evia v143 removes cloned menu transitions and keeps the approved app behaviour unchanged.','// Evia v144 adds a true content-only fade without delaying navigation.')
              s=s.replace('evia-shell-v143','evia-shell-v144')
              s=s.replace('./assets/evia-version-v143.js','./assets/evia-version-v144.js')
              s=s.replace('./assets/evia-menu-fade-v143.js','./assets/evia-menu-fade-v144.js')
              p.write_text(s)
          manifest={
            'version':'144',
            'title':'Premium menu fade',
            'details':[
              'Only menu transition behaviour changed',
              'The changing menu content now fades out as you press and fades smoothly back in after the normal instant navigation',
              'Evia, the header and bottom progress arches stay completely still',
              'Camera, photo speed, video prompts, timestamps, saving, course tiles and layouts are unchanged'
            ],
            'summary':'Evia v144 adds a true smooth menu fade without touching the working app.',
            'changes':['True fade out and fade in','Persistent Evia UI stays fixed','No cloned screens or delayed clicks','Everything else unchanged']
          }
          text=json.dumps(manifest,indent=2)+'\n';Path('update.json').write_text(text);Path('public/update.json').write_text(text)
          PY
      - name: Verify transition behaviour
        run: |
          node --check assets/evia-menu-fade-v144.js
          node --check assets/evia-version-v144.js
          node --check assets/evia-staged-evidence-v132.js
          node --check assets/evia-stage-save-v139.js
          node --check assets/evia-photo-fast-v140.js
          node - <<'NODE'
          const fs=require('fs');
          const js=fs.readFileSync('assets/evia-menu-fade-v144.js','utf8');
          for(const x of ['pointerdown','MutationObserver','OUT_MS=90,IN_MS=170','OUT_TO=.18','button.closest?.(".self-panel")','mode:"pointer-fade-out-render-fade-in"'])if(!js.includes(x))throw Error('Missing premium fade behaviour: '+x);
          for(const bad of ['cloneNode','ghostOf(','document.body.appendChild','preventDefault()','stopPropagation()','stopImmediatePropagation()','button.click()'])if(js.includes(bad))throw Error('Forbidden transition behaviour remains: '+bad);
          NODE
          grep -q 'name="evia-app-version" content="144"' index.html
          grep -q 'evia-photo-fast-v140.js?v=140' index.html
          grep -q 'evia-menu-fade-v144.js?v=144' index.html
          grep -q 'evia-staged-evidence-v132.js?v=138' index.html
          grep -q 'evia-stage-save-v139.js?v=139' index.html
          grep -q 'evia-version-v144.js?v=144' index.html
          grep -q 'evia-updater.js?v=144' index.html
          grep -q 'evia-shell-v144' sw.js
          grep -q 'evia-shell-v144' public/sw.js
          test "$(git hash-object assets/evia-staged-evidence-v132.css)" = "d4f040b3be38c59d36f25f0c8e39525119011227"
          test "$(git hash-object assets/evia-staged-evidence-v132.js)" = "31e544a5ccd5b009efe652ecadec1bcd13b5dcc5"
          test "$(git hash-object assets/evia-stage-save-v139.js)" = "72c4f3c6dca2b88fe4b14b804ece2441ab81cb89"
          test "$(git hash-object assets/evia-photo-fast-v140.js)" = "da8b78b029069280f6b734afb5c33b5d1bd5bcc4"
          node - <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('update.json','utf8')),b=JSON.parse(fs.readFileSync('public/update.json','utf8'));
          if(a.version!=='144'||JSON.stringify(a)!==JSON.stringify(b))throw Error('v144 manifest mismatch');
          if(fs.readFileSync('sw.js','utf8').trimEnd()!==fs.readFileSync('public/sw.js','utf8').trimEnd())throw Error('service workers differ');
          NODE
          node --test tests/next-visit-v95.test.mjs tests/update-notice-v96.test.mjs tests/milos-review-sync-v97.test.mjs tests/performance-current.test.mjs
      - name: Update permanent fade verification
        run: |
          cat > .github/workflows/verify-evidence-v136.yml <<'EOF'
          name: Verify Evia menu fade v144
          on:
            push:
              branches: [main]
            pull_request:
              branches: [main]
            workflow_dispatch:
          permissions:
            contents: read
          jobs:
            verify-v144:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                - name: Verify protected behaviour and fade
                  run: |
                    node --check assets/evia-menu-fade-v144.js
                    node --check assets/evia-version-v144.js
                    node --check assets/evia-staged-evidence-v132.js
                    node --check assets/evia-stage-save-v139.js
                    node --check assets/evia-photo-fast-v140.js
                    test "$(git hash-object assets/evia-staged-evidence-v132.css)" = "d4f040b3be38c59d36f25f0c8e39525119011227"
                    test "$(git hash-object assets/evia-staged-evidence-v132.js)" = "31e544a5ccd5b009efe652ecadec1bcd13b5dcc5"
                    test "$(git hash-object assets/evia-stage-save-v139.js)" = "72c4f3c6dca2b88fe4b14b804ece2441ab81cb89"
                    test "$(git hash-object assets/evia-photo-fast-v140.js)" = "da8b78b029069280f6b734afb5c33b5d1bd5bcc4"
                    grep -q 'pointerdown' assets/evia-menu-fade-v144.js
                    grep -q 'MutationObserver' assets/evia-menu-fade-v144.js
                    ! grep -q 'cloneNode' assets/evia-menu-fade-v144.js
                    ! grep -q 'preventDefault' assets/evia-menu-fade-v144.js
                    grep -q 'name="evia-app-version" content="144"' index.html
                    grep -q 'evia-menu-fade-v144.js?v=144' index.html
                    grep -q 'evia-shell-v144' sw.js
                    node --test tests/next-visit-v95.test.mjs tests/update-notice-v96.test.mjs tests/milos-review-sync-v97.test.mjs tests/performance-current.test.mjs
          EOF
      - name: Commit v144
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js public/sw.js update.json public/update.json .github/workflows/verify-evidence-v136.yml
          git commit -m 'Release Evia v144 premium menu fade'
          git push
