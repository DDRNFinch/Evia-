name: Apply Evia v145 core menu transition

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Protect working evidence system
        run: |
          test "$(git hash-object assets/evia-staged-evidence-v132.css)" = "d4f040b3be38c59d36f25f0c8e39525119011227"
          test "$(git hash-object assets/evia-staged-evidence-v132.js)" = "31e544a5ccd5b009efe652ecadec1bcd13b5dcc5"
          test "$(git hash-object assets/evia-stage-save-v139.js)" = "72c4f3c6dca2b88fe4b14b804ece2441ab81cb89"
          test "$(git hash-object assets/evia-photo-fast-v140.js)" = "da8b78b029069280f6b734afb5c33b5d1bd5bcc4"

      - name: Move transition into Evia renderer
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          core=Path('assets/evia-selfobs-live.js')
          s=core.read_text()
          old='function render(){const p=$(".self-panel");if(!p||!open)return;if(view==="home")home(p);else if(view==="jobs")jobs(p);else if(view==="opps")opps(p);else if(view==="capture")capture(p);else if(view==="question")question(p);else if(view==="answer")answer(p);else if(view==="evidence")evidence(p);else if(view==="coverage")coverage(p);else if(view==="day")day(p);bindPanel()}'
          new='''const MENU_FADE_VIEWS=new Set(["home","jobs","opps","evidence","coverage","day"]);\nlet menuFadeToken=0,menuFadeOut=null,menuFadeIn=null;\nfunction stopMenuFade(p){try{menuFadeOut?.cancel?.()}catch{}try{menuFadeIn?.cancel?.()}catch{}menuFadeOut=menuFadeIn=null;if(p)p.style.removeProperty("opacity")}\nfunction paint(p){if(view==="home")home(p);else if(view==="jobs")jobs(p);else if(view==="opps")opps(p);else if(view==="capture")capture(p);else if(view==="question")question(p);else if(view==="answer")answer(p);else if(view==="evidence")evidence(p);else if(view==="coverage")coverage(p);else if(view==="day")day(p);p.dataset.eviaView=view;bindPanel()}\nfunction render(transition=false){\n  const p=$(".self-panel");if(!p||!open)return;\n  const previous=p.dataset.eviaView||"",next=view;\n  const reduced=window.matchMedia?.("(prefers-reduced-motion: reduce)")?.matches;\n  const safe=transition&&MENU_FADE_VIEWS.has(previous)&&MENU_FADE_VIEWS.has(next)&&previous!==next&&!document.querySelector(".evia-stage-overlay-v132")&&!reduced&&typeof p.animate==="function";\n  if(!safe){menuFadeToken++;stopMenuFade(p);paint(p);return}\n  const token=++menuFadeToken;stopMenuFade(p);\n  menuFadeOut=p.animate([{opacity:1},{opacity:.04}],{duration:85,easing:"cubic-bezier(.4,0,1,1)",fill:"forwards"});\n  menuFadeOut.onfinish=()=>{\n    if(token!==menuFadeToken)return;\n    p.style.opacity=".04";try{menuFadeOut?.cancel?.()}catch{}menuFadeOut=null;\n    paint(p);\n    requestAnimationFrame(()=>{\n      if(token!==menuFadeToken)return;\n      menuFadeIn=p.animate([{opacity:.04},{opacity:1}],{duration:145,easing:"cubic-bezier(.16,1,.3,1)",fill:"forwards"});\n      menuFadeIn.onfinish=()=>{if(token!==menuFadeToken)return;p.style.opacity="1";try{menuFadeIn?.cancel?.()}catch{}menuFadeIn=null;p.style.removeProperty("opacity")};\n    });\n  };\n}'''
          if old not in s:
              raise SystemExit('core render signature changed; aborting')
          s=s.replace(old,new,1)

          replacements={
            'document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{cat=findCat(b.dataset.cat);view="jobs";render()});':'document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{cat=findCat(b.dataset.cat);view="jobs";render(true)});',
            'document.querySelectorAll("[data-job]").forEach(b=>b.onclick=()=>{job=findJob(cat,b.dataset.job);view="opps";render()});':'document.querySelectorAll("[data-job]").forEach(b=>b.onclick=()=>{job=findJob(cat,b.dataset.job);view="opps";render(true)});',
            'document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});':'document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render(true)});',
            'function goBack(){if(view==="jobs")view="home";else if(view==="opps")view="jobs";else if(view==="capture"||view==="question")view="opps";else if(view==="answer")view="question";else view="home";render()}':'function goBack(){if(view==="jobs")view="home";else if(view==="opps")view="jobs";else if(view==="capture"||view==="question")view="opps";else if(view==="answer")view="question";else view="home";render(true)}',
            'else if(a==="home"){view="home";render()}':'else if(a==="home"){view="home";render(true)}',
            'else if(a==="evidence"){view="evidence";render()}':'else if(a==="evidence"){view="evidence";render(true)}',
            'else if(a==="coverage"){view="coverage";render()}':'else if(a==="coverage"){view="coverage";render(true)}',
            'function finish(){const n=today().length;recap={at:Date.now(),count:n,touched:touched()};write(RECAP,recap);dayIds=[];write(DAY,dayIds);cat=job=opp=null;view="day";render()}':'function finish(){const n=today().length;recap={at:Date.now(),count:n,touched:touched()};write(RECAP,recap);dayIds=[];write(DAY,dayIds);cat=job=opp=null;view="day";render(true)}'
          }
          for old_text,new_text in replacements.items():
              if old_text not in s:
                  raise SystemExit('expected core navigation line missing: '+old_text[:70])
              s=s.replace(old_text,new_text,1)
          core.write_text(s)

          idx=Path('index.html'); h=idx.read_text()
          h=h.replace('name="evia-app-version" content="143"','name="evia-app-version" content="145"')
          h=h.replace('./assets/evia-version-v143.js?v=143','./assets/evia-version-v145.js?v=145')
          h=h.replace('<script defer src="./assets/evia-menu-fade-v143.js?v=143"></script>\n','')
          h=h.replace('<script defer src="./assets/evia-menu-fade-v144.js?v=144"></script>\n','')
          h=h.replace('./assets/evia-selfobs-live.js?v=133','./assets/evia-selfobs-live.js?v=145')
          h=h.replace('./assets/evia-updater.js?v=143','./assets/evia-updater.js?v=145')
          h=h.replace('./assets/evia-updater.js?v=144','./assets/evia-updater.js?v=145')
          idx.write_text(h)

          Path('assets/evia-version-v145.js').write_text('(()=>{"use strict";const meta=document.querySelector(\'meta[name="evia-app-version"]\');if(meta)meta.setAttribute("content","145");window.EviaAppVersion=145})();\n')

          for name in ['sw.js','public/sw.js']:
              p=Path(name); w=p.read_text()
              import re
              w=re.sub(r'// Evia v14[0-9][^\n]*','// Evia v145 keeps camera/evidence untouched and runs menu fades inside the core renderer.',w,count=1)
              w=re.sub(r"const CACHE_NAME = 'evia-shell-v14[0-9]';","const CACHE_NAME = 'evia-shell-v145';",w,count=1)
              w=w.replace("  './assets/evia-version-v143.js',\n","  './assets/evia-version-v145.js',\n")
              w=w.replace("  './assets/evia-version-v144.js',\n","  './assets/evia-version-v145.js',\n")
              w=w.replace("  './assets/evia-menu-fade-v143.js',\n",'')
              w=w.replace("  './assets/evia-menu-fade-v144.js',\n",'')
              p.write_text(w)

          manifest={
            'version':'145',
            'title':'Camera restored, core fade',
            'details':[
              'The working Evia photo and video camera system is untouched and restored to its normal route',
              'Menu fades now run inside Evia core rendering instead of intercepting clicks or observing the evidence overlay',
              'Only ordinary menu-to-menu changes fade out and fade back in',
              'Evidence capture, prompts, timestamps, saving, Property Maintenance tiles and layouts are unchanged'
            ],
            'summary':'Evia v145 restores cameras and moves the fade into the correct core render path.',
            'changes':['Restore camera route','Core menu fade out and in','No fade on evidence capture','Everything else unchanged']
          }
          text=json.dumps(manifest,indent=2)+'\n'
          Path('update.json').write_text(text);Path('public/update.json').write_text(text)

          for p in Path('assets').glob('evia-menu-fade-v*.js'):
              p.unlink()
          PY

      - name: Verify camera and core transition
        run: |
          node --check assets/evia-selfobs-live.js
          node --check assets/evia-staged-evidence-v132.js
          node --check assets/evia-stage-save-v139.js
          node --check assets/evia-photo-fast-v140.js
          node --check assets/evia-version-v145.js
          node --check sw.js
          node --check public/sw.js
          test "$(git hash-object assets/evia-staged-evidence-v132.css)" = "d4f040b3be38c59d36f25f0c8e39525119011227"
          test "$(git hash-object assets/evia-staged-evidence-v132.js)" = "31e544a5ccd5b009efe652ecadec1bcd13b5dcc5"
          test "$(git hash-object assets/evia-stage-save-v139.js)" = "72c4f3c6dca2b88fe4b14b804ece2441ab81cb89"
          test "$(git hash-object assets/evia-photo-fast-v140.js)" = "da8b78b029069280f6b734afb5c33b5d1bd5bcc4"
          grep -q 'MENU_FADE_VIEWS' assets/evia-selfobs-live.js
          grep -q 'render(true)' assets/evia-selfobs-live.js
          grep -q 'evia-stage-overlay-v132' assets/evia-selfobs-live.js
          grep -q 'function openPhoto' assets/evia-staged-evidence-v132.js
          grep -q 'function openVideo' assets/evia-staged-evidence-v132.js
          grep -q 'data-next-prompt' assets/evia-staged-evidence-v132.js
          grep -q 'markers.push' assets/evia-staged-evidence-v132.js
          grep -q 'name="evia-app-version" content="145"' index.html
          grep -q 'evia-selfobs-live.js?v=145' index.html
          grep -q 'evia-version-v145.js?v=145' index.html
          ! grep -q 'evia-menu-fade' index.html
          ! grep -q 'evia-menu-fade' sw.js
          test "$(find assets -maxdepth 1 -name 'evia-menu-fade-v*.js' | wc -l)" -eq 0
          grep -q 'evia-shell-v145' sw.js
          grep -q 'evia-shell-v145' public/sw.js
          cmp -s sw.js public/sw.js
          node - <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('update.json','utf8')),b=JSON.parse(fs.readFileSync('public/update.json','utf8'));
          if(a.version!=='145'||JSON.stringify(a)!==JSON.stringify(b))throw Error('manifest mismatch');
          const core=fs.readFileSync('assets/evia-selfobs-live.js','utf8');
          if(core.includes('cloneNode')||core.includes('pointerdown'))throw Error('external-style transition logic leaked into core');
          const idx=fs.readFileSync('index.html','utf8');
          for(const required of ['evia-staged-evidence-v132.js?v=138','evia-stage-save-v139.js?v=139','evia-photo-fast-v140.js?v=140'])if(!idx.includes(required))throw Error('protected evidence script missing: '+required);
          NODE
          node --test tests/next-visit-v95.test.mjs tests/update-notice-v96.test.mjs tests/milos-review-sync-v97.test.mjs tests/performance-current.test.mjs

      - name: Update permanent verification and clean apply workflow
        run: |
          cat > .github/workflows/verify-evidence-v136.yml <<'EOF'
          name: Verify Evia v145 core transition
          on:
            push:
              branches: [main]
            pull_request:
              branches: [main]
            workflow_dispatch:
          permissions:
            contents: read
          jobs:
            verify-v145:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                - name: Verify working evidence and core fade
                  run: |
                    node --check assets/evia-selfobs-live.js
                    node --check assets/evia-staged-evidence-v132.js
                    node --check assets/evia-stage-save-v139.js
                    node --check assets/evia-photo-fast-v140.js
                    test "$(git hash-object assets/evia-staged-evidence-v132.css)" = "d4f040b3be38c59d36f25f0c8e39525119011227"
                    test "$(git hash-object assets/evia-staged-evidence-v132.js)" = "31e544a5ccd5b009efe652ecadec1bcd13b5dcc5"
                    test "$(git hash-object assets/evia-stage-save-v139.js)" = "72c4f3c6dca2b88fe4b14b804ece2441ab81cb89"
                    test "$(git hash-object assets/evia-photo-fast-v140.js)" = "da8b78b029069280f6b734afb5c33b5d1bd5bcc4"
                    grep -q 'MENU_FADE_VIEWS' assets/evia-selfobs-live.js
                    grep -q 'evia-stage-overlay-v132' assets/evia-selfobs-live.js
                    ! grep -q 'evia-menu-fade' index.html
                    ! grep -q 'evia-menu-fade' sw.js
                    grep -q 'evia-shell-v145' sw.js
                    node --test tests/next-visit-v95.test.mjs tests/update-notice-v96.test.mjs tests/milos-review-sync-v97.test.mjs tests/performance-current.test.mjs
          EOF
          rm -f .github/workflows/apply-v145-core-menu-transition.yml

      - name: Commit v145
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release Evia v145 core menu transition'
          git push
