name: Verify Evia staged evidence v134

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-staged:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check production JavaScript
        run: |
          node --check assets/evia-staged-evidence-v132.js
          node --check assets/evia-st0171-v124.js
          node --check assets/evia-export-status.js
          node --check assets/evia-version-v134.js
          node --check assets/evia-selfobs-live.js
          node --check sw.js
          node --check public/sw.js
      - name: Check v134 release wiring
        shell: bash
        run: |
          grep -q 'name="evia-app-version" content="134"' index.html
          grep -q 'evia-version-v134.js?v=134' index.html
          grep -q 'evia-st0171-v124.js?v=134' index.html
          grep -q 'evia-staged-evidence-v132.js?v=134' index.html
          grep -q 'evia-staged-evidence-v132.css?v=134' index.html
          grep -q "evia-shell-v134" sw.js
          grep -q "evia-shell-v134" public/sw.js
          grep -q 'const VERSION=134' assets/evia-st0171-v124.js
          grep -q 'document.addEventListener("click",onClick,true)' assets/evia-staged-evidence-v132.js
          grep -q 'display:none!important;visibility:hidden!important;pointer-events:none!important' assets/evia-staged-evidence-v132.css
          test ! -e assets/evia-version-v133.js
      - name: Check manifests and offline shell match
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('update.json','utf8'));
          const b=JSON.parse(fs.readFileSync('public/update.json','utf8'));
          if(a.version!=='134')throw Error('update.json is not v134');
          if(JSON.stringify(a)!==JSON.stringify(b))throw Error('public update manifest differs');
          const sw=fs.readFileSync('sw.js','utf8').trimEnd();
          const psw=fs.readFileSync('public/sw.js','utf8').trimEnd();
          if(sw!==psw)throw Error('service workers differ');
          NODE
      - name: Check Property Maintenance sentence stages
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('assets/evia-st0171-v124.js','utf8');
          const required=['drainage_fault','door_window','plaster_repair','paint_repair','tile_repair','floor_repair','masonry_repair','roof_repair','fence_repair','ground_repair'];
          for(const id of required)if(!s.includes(id+':['))throw Error('Missing ST0171 stages for '+id);
          for(const id of ['plumbing_fault','energy_fault'])if(s.includes(id+':['))throw Error('Single-item task incorrectly split: '+id);
          for(const word of ['Tiling repair','Setting out','Preparation','Cutting'])if(!s.includes(word))throw Error('Missing tiling stage '+word);
          for(const word of ['Plaster defect','Finished repair','Flooring defect'])if(!s.includes(word))throw Error('Missing expected stage '+word);
          for(const old of ['Tiling defect','Preparation & setting out','Materials & repair','Surface condition'])if(s.includes(old))throw Error('Old invented stage still present: '+old);
          NODE
      - name: Run current regression tests
        run: node --test tests/next-visit-v95.test.mjs tests/update-notice-v96.test.mjs tests/milos-review-sync-v97.test.mjs tests/performance-current.test.mjs
      - name: Verify production asset references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys
          index = Path('index.html').read_text(encoding='utf-8')
          missing=[]
          for raw in re.findall(r'(?:src|href)=["\']([^"\']+)["\']', index):
              path=raw.split('?',1)[0]
              if path.startswith('/Evia/'):
                  local=Path(path[len('/Evia/'):])
              elif path.startswith('./'):
                  local=Path(path[2:])
              else:
                  continue
              if not local.exists(): missing.append(str(local))
          if missing:
              print('Missing production references:')
              print('\n'.join(sorted(set(missing))))
              sys.exit(1)
          surfaces=[Path('index.html'),Path('sw.js')]
          for root in (Path('assets'),Path('app'),Path('course-delivery')):
              if root.exists(): surfaces.extend(p for p in root.rglob('*') if p.is_file() and p.suffix.lower() in {'.js','.css','.ts','.tsx','.html'})
          text={}
          for p in surfaces:
              try:text[p]=p.read_text(encoding='utf-8',errors='ignore')
              except Exception:text[p]=''
          orphaned=[]
          for asset in sorted(Path('assets').iterdir()):
              if not asset.is_file() or asset.suffix.lower() not in {'.js','.css'}: continue
              name=asset.name
              if not any(p!=asset and name in body for p,body in text.items()): orphaned.append(str(asset))
          if orphaned:
              print('Unreferenced production assets:')
              print('\n'.join(orphaned))
              sys.exit(1)
          PY
      - name: Record successful verification
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          mkdir -p .github/verification
          printf 'Evia v134 Property Maintenance verification passed.\n' > .github/verification/v134-full-passed.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/verification/v134-full-passed.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Verify Evia v134 Property Maintenance'
          git push