name: Apply Evia v146 camera route repair

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Protect approved camera presentation and saving
        run: |
          test "$(git hash-object assets/evia-staged-evidence-v132.css)" = "d4f040b3be38c59d36f25f0c8e39525119011227"
          test "$(git hash-object assets/evia-staged-evidence-v132.js)" = "31e544a5ccd5b009efe652ecadec1bcd13b5dcc5"
          test "$(git hash-object assets/evia-stage-save-v139.js)" = "72c4f3c6dca2b88fe4b14b804ece2441ab81cb89"
          test "$(git hash-object assets/evia-photo-fast-v140.js)" = "da8b78b029069280f6b734afb5c33b5d1bd5bcc4"

      - name: Route every visual evidence task through Evia camera
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          staged=Path('assets/evia-staged-evidence-v132.js')
          s=staged.read_text()
          old='function stagesFor(opp){return Array.isArray(opp?.stages)?opp.stages.filter(Boolean):[]}'
          new='function stagesFor(opp){const stages=Array.isArray(opp?.stages)?opp.stages.filter(Boolean):[];if(stages.length)return stages;if(!opp)return[];return[{id:`${opp.id||"evidence"}-single`,title:opp.title||"Evidence",instruction:opp.instruction||"Show this evidence clearly."}]}'
          if old not in s:
              raise SystemExit('stagesFor anchor not found')
          s=s.replace(old,new,1)
          staged.write_text(s)

          p=Path('index.html'); s=p.read_text()
          # Remove the obsolete native-camera controls/fallback. This block is what launched Samsung/Android camera.
          s,n=re.subn(r'<style>\n\.selfobs \.evia-native-capture.*?</style>\n','',s,count=1,flags=re.S)
          if n!=1: raise SystemExit('native capture CSS block not found')
          s,n=re.subn(r'<body><div id="root"></div>\n<script>\n\(function\(\)\{\n  \'use strict\';\n  var repairQueued=false;.*?</script>\n</body>', '<body><div id="root"></div>\n</body>', s, count=1, flags=re.S)
          if n!=1: raise SystemExit('native capture JS block not found')
          s=s.replace('name="evia-app-version" content="145"','name="evia-app-version" content="146"')
          s=s.replace('./assets/evia-version-v145.js?v=145','./assets/evia-version-v146.js?v=146')
          s=s.replace('./assets/evia-staged-evidence-v132.js?v=138','./assets/evia-staged-evidence-v132.js?v=146')
          s=s.replace('./assets/evia-updater.js?v=145','./assets/evia-updater.js?v=146')
          p.write_text(s)

          Path('assets/evia-version-v146.js').write_text('(()=>{"use strict";const meta=document.querySelector(\'meta[name="evia-app-version"]\');if(meta)meta.setAttribute("content","146");window.EviaAppVersion=146})();\n')

          for name in ['sw.js','public/sw.js']:
              p=Path(name); s=p.read_text()
              s=s.replace('// Evia v145 keeps the working camera/evidence system and runs menu fades inside Evia core.','// Evia v146 routes all visual evidence through the existing Evia prompted camera.')
              s=s.replace("evia-shell-v145","evia-shell-v146")
              s=s.replace("./assets/evia-version-v145.js","./assets/evia-version-v146.js")
              p.write_text(s)

          manifest={
            'version':'146',
            'title':'Evia camera route restored',
            'details':[
              'Removed the old native phone-camera fallback that was still taking over photo and video evidence',
              'Single evidence tasks now use the same full-screen Evia camera as staged evidence tasks',
              'Photo prompts remain visible on the camera screen',
              'Video keeps the visible prompt, recording timer, Next prompt button and timestamp markers',
              'Camera styling, saving, photo speed, evidence tiles and menu layout are otherwise unchanged'
            ],
            'summary':'Evia v146 restores the full-screen prompted camera for every visual evidence task.',
            'changes':['Remove native camera takeover','Use Evia camera for single evidence tasks','Keep prompts and timestamps','No other UI changes']
          }
          text=json.dumps(manifest,indent=2)+'\n'
          Path('update.json').write_text(text);Path('public/update.json').write_text(text)
          PY

      - name: Verify the exact camera regression
        run: |
          node --check assets/evia-staged-evidence-v132.js
          node --check assets/evia-stage-save-v139.js
          node --check assets/evia-photo-fast-v140.js
          node --check assets/evia-version-v146.js
          node --check assets/evia-selfobs-live.js
          node --check sw.js
          node --check public/sw.js
          test "$(git hash-object assets/evia-staged-evidence-v132.css)" = "d4f040b3be38c59d36f25f0c8e39525119011227"
          test "$(git hash-object assets/evia-stage-save-v139.js)" = "72c4f3c6dca2b88fe4b14b804ece2441ab81cb89"
          test "$(git hash-object assets/evia-photo-fast-v140.js)" = "da8b78b029069280f6b734afb5c33b5d1bd5bcc4"
          grep -q 'function stagesFor(opp){const stages=' assets/evia-staged-evidence-v132.js
          grep -q 'if(stages.length)return stages' assets/evia-staged-evidence-v132.js
          grep -q 'title:opp.title' assets/evia-staged-evidence-v132.js
          grep -q 'navigator.mediaDevices.getUserMedia' assets/evia-staged-evidence-v132.js
          grep -q 'data-next-prompt' assets/evia-staged-evidence-v132.js
          grep -q 'markers=\[{seconds:0,prompt:prompts\[0\]}\]' assets/evia-staged-evidence-v132.js
          ! grep -q 'evia-native-capture' index.html
          ! grep -q 'openNativeCapture' index.html
          grep -q 'name="evia-app-version" content="146"' index.html
          grep -q 'evia-selfobs-live.js?v=145' index.html
          grep -q 'evia-staged-evidence-v132.js?v=146' index.html
          grep -q 'evia-stage-save-v139.js?v=139' index.html
          grep -q 'evia-photo-fast-v140.js?v=140' index.html
          grep -q 'evia-version-v146.js?v=146' index.html
          grep -q 'evia-shell-v146' sw.js
          grep -q 'evia-shell-v146' public/sw.js
          grep -q './assets/evia-version-v146.js' sw.js
          ! grep -q 'evia-menu-fade' index.html
          node - <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('update.json','utf8')),b=JSON.parse(fs.readFileSync('public/update.json','utf8'));
          if(a.version!=='146'||JSON.stringify(a)!==JSON.stringify(b))throw Error('v146 manifest mismatch');
          if(fs.readFileSync('sw.js','utf8').trimEnd()!==fs.readFileSync('public/sw.js','utf8').trimEnd())throw Error('service workers differ');
          NODE
          node --test tests/next-visit-v95.test.mjs tests/update-notice-v96.test.mjs tests/milos-review-sync-v97.test.mjs tests/performance-current.test.mjs

      - name: Commit v146 and remove one-shot installer
        run: |
          rm -f .github/workflows/apply-v146-camera-route.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release Evia v146 camera route repair'
          git push
