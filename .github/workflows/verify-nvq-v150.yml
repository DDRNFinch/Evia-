name: Verify Evia NVQ

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read current Evia version
        run: |
          VERSION=$(node -e "const fs=require('fs');process.stdout.write(String(JSON.parse(fs.readFileSync('update.json','utf8')).version))")
          echo "EVIA_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Syntax checks
        run: |
          node --check assets/evia-trowel-framework-v150.js
          node --check assets/evia-trowel-practical-v151.js
          node --check assets/evia-nvq-practical-nav-v151.js
          node --check assets/evia-nvq-structure-browser-v151.js
          node --check assets/evia-nvq-audio-v150.js
          node --check assets/evia-nvq-pack-export-v150.js
          node --check assets/evia-signature-smooth-v155.js
          node --check assets/evia-post-evidence-otj-v149.js
          node --check assets/evia-otj-export.js
          node --check assets/evia-6570-pack-migration.js
          node --check assets/evia-staged-evidence-v202.js
          node --check assets/evia-evidence-state-v202.js
          node --check "assets/evia-version-v${EVIA_VERSION}.js"
          node --check sw.js

      - name: Protect approved existing behaviour
        run: |
          test "$(git hash-object assets/evia-staged-evidence-v132.css)" = "d4f040b3be38c59d36f25f0c8e39525119011227"
          test "$(git hash-object assets/evia-stage-save-v139.js)" = "72c4f3c6dca2b88fe4b14b804ece2441ab81cb89"
          test "$(git hash-object assets/evia-st0171-v124.js)" = "d6c0a15cd88c054acdd245f6b62bad4e0e52558b"
          test "$(git hash-object assets/evia-nvq-pack-export-v150.js)" = "8dd1b0a8c7376867368ad94b57821e5b6783b1f5"
          grep -q 'renderPhotoCanvasReview(canvas,filePromise)' assets/evia-staged-evidence-v202.js
          grep -q 'if(!states.length)return' assets/evia-evidence-state-v202.js
          if grep -q 'MutationObserver' assets/evia-evidence-state-v202.js; then exit 1; fi

      - name: Audit complete NVQ activity framework
        run: |
          node <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('assets/evia-trowel-framework-v150.js','utf8');
          const start=src.indexOf('const GROUPS=');
          const end=src.indexOf(';\nconst ROUTES=',start);
          if(start<0||end<0) throw Error('GROUPS data unavailable');
          const groups=JSON.parse(src.slice(start+'const GROUPS='.length,end));
          const subs=groups.flatMap(g=>g.subcategories||[]);
          const acts=subs.flatMap(s=>s.activities||[]);
          const codes=acts.flatMap(a=>a.codes||[]).map(String);
          const unique=new Set(codes);
          if(groups.length!==5) throw Error(`main categories ${groups.length}/5`);
          if(subs.length!==20) throw Error(`sub-categories ${subs.length}/20`);
          if(acts.length!==44) throw Error(`activities ${acts.length}/44`);
          if(codes.length!==335||unique.size!==335) throw Error(`AC assignments ${codes.length}, unique ${unique.size}, expected 335/335`);
          const practical=acts.filter(a=>a.code.startsWith('E'));
          if(practical.length!==8) throw Error(`practical activities ${practical.length}/8`);
          for(const a of practical){
            if(!Array.isArray(a.stages)||a.stages.length<3) throw Error(`${a.code} practical evidence activities`);
            a.stages.forEach((stage,i)=>{if(!stage.methods?.includes('photo')||!stage.methods?.includes('video'))throw Error(`${a.code}.${i+1} visual methods`)})
          }
          const mandatory=new Set(['102','234','235','303','300','313','502','701']);
          const options={thin:'238',repair:'690',specialist:'828',drainage:'837'};
          const expected={thin:238,repair:239,specialist:239,drainage:240};
          for(const [route,opt] of Object.entries(options)){
            const allowed=new Set([...mandatory,opt]);
            const routeCodes=codes.filter(c=>allowed.has(c.split('.')[0]));
            if(new Set(routeCodes).size!==expected[route]||routeCodes.length!==expected[route]) throw Error(`${route} route ${routeCodes.length}/${expected[route]}`);
          }
          NODE

      - name: Check Section E overlay handoff
        run: |
          grep -q 'returnFromEvidence=true;removeList(false)' assets/evia-nvq-practical-nav-v151.js
          grep -q 'restoreParent(ctx' assets/evia-nvq-practical-nav-v151.js
          grep -q 'const VERSION=152' assets/evia-nvq-practical-nav-v151.js

      - name: Check A-E AC coverage navigation
        run: |
          grep -q 'AC coverage now follows the same NVQ structure' assets/evia-nvq-structure-browser-v151.js
          grep -q 'data-nvq151-group' assets/evia-nvq-structure-browser-v151.js
          grep -q 'data-nvq151-sub' assets/evia-nvq-structure-browser-v151.js
          grep -q 'data-nvq151-activity' assets/evia-nvq-structure-browser-v151.js
          if grep -q 'evia-nvq-ac-browser-v90.js' index.html; then exit 1; fi

      - name: Check post-evidence OTJ and GLH routing
        run: |
          grep -q 'const VERSION=153' assets/evia-post-evidence-otj-v149.js
          grep -q 'GLH_KEY="evia-glh-entries"' assets/evia-post-evidence-otj-v149.js
          grep -q 'OTJ_KEY="evia-otj-entries"' assets/evia-post-evidence-otj-v149.js
          grep -q 'courseType==="nvq"' assets/evia-post-evidence-otj-v149.js
          grep -q 'recordGlh' assets/evia-post-evidence-otj-v149.js
          grep -q 'recordOtj' assets/evia-post-evidence-otj-v149.js
          grep -q 'EviaNVQV94?.refresh' assets/evia-post-evidence-otj-v149.js
          grep -q 'evia:glh-updated' assets/evia-post-evidence-otj-v149.js
          grep -q 'evia-post-evidence-otj-v149.js?v=153' index.html

      - name: Check learning PDF in evidence packs
        run: |
          grep -q 'const VERSION=156' assets/evia-otj-export.js
          grep -q 'OTJ_KEY="evia-otj-entries"' assets/evia-otj-export.js
          grep -q 'GLH_KEY="evia-glh-entries"' assets/evia-otj-export.js
          grep -q 'Overall ${p.short} since last download' assets/evia-otj-export.js
          grep -q 'Evia-GLH.pdf' assets/evia-otj-export.js
          grep -q 'Evia-Off-the-Job.pdf' assets/evia-otj-export.js
          grep -q 'data-nvq-pack-download' assets/evia-otj-export.js
          grep -q 'Evia-NVQ-Evidence-Packs-' assets/evia-otj-export.js
          grep -q 'Evia-New-Evidence-' assets/evia-otj-export.js

      - name: Check learner-friendly arch labels
        run: |
          grep -q 'ARCH_LABELS={TOC:"Time",KSB:"Course",AC:"Course",OTJ:"Learn",GLH:"Learn",EPA:"Test",ARP:"Test",Units:"Test"}' assets/evia-selfobs-live.js
          if grep -q 'evia-arch-labels-v154.js' index.html; then exit 1; fi

      - name: Check signature accuracy fix
        run: |
          grep -q 'const VERSION=155' assets/evia-signature-smooth-v155.js
          grep -q 'getCoalescedEvents' assets/evia-signature-smooth-v155.js
          grep -q 'quadraticCurveTo' assets/evia-signature-smooth-v155.js
          grep -q 'touchAction="none"' assets/evia-signature-smooth-v155.js
          grep -q 'evia-signature-smooth-v155.js?v=155' index.html

      - name: Check current release wiring
        run: |
          grep -q "meta name=\"evia-app-version\" content=\"${EVIA_VERSION}\"" index.html
          grep -q "evia-version-v${EVIA_VERSION}.js?v=${EVIA_VERSION}" index.html
          grep -q "window.EviaAppVersion=${EVIA_VERSION}" "assets/evia-version-v${EVIA_VERSION}.js"
          grep -q "evia-shell-v${EVIA_VERSION}" sw.js
          grep -q 'evia-staged-evidence-v202.js' index.html
          grep -q 'evia-evidence-state-v202.js' index.html
          grep -q 'evia-otj-export.js' sw.js
