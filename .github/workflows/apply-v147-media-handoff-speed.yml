name: Apply Evia v147 media handoff speed

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Protect everything except media handoff timing
        run: |
          test "$(git hash-object assets/evia-staged-evidence-v132.js)" = "905ba29870b563a7404466a61402aa2cba1f7831"
          test "$(git hash-object assets/evia-staged-evidence-v132.css)" = "d4f040b3be38c59d36f25f0c8e39525119011227"
          test "$(git hash-object assets/evia-stage-save-v139.js)" = "72c4f3c6dca2b88fe4b14b804ece2441ab81cb89"
          test "$(git hash-object assets/evia-photo-fast-v140.js)" = "da8b78b029069280f6b734afb5c33b5d1bd5bcc4"
          test "$(git hash-object assets/evia-selfobs-live.js)" = "6254b425d4ce0771ea79f8d3ca16b62824d66542"

      - name: Make draft persistence non-blocking
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p=Path('assets/evia-staged-evidence-v132.js')
          s=p.read_text()
          s=s.replace('const VERSION=137;','const VERSION=147;',1)
          old='let active=null,overlay=null,stream=null,recorder=null,chunks=[],timer=null,objectUrl="",internal=false,videoState=null,page="choice";'
          new='let active=null,overlay=null,stream=null,recorder=null,chunks=[],timer=null,objectUrl="",internal=false,videoState=null,page="choice",pendingDraft=null;'
          if old not in s: raise SystemExit('state anchor missing')
          s=s.replace(old,new,1)
          old='o.querySelector("[data-use-photo]").onclick=async()=>{await saveDraft(file,"photo",null);renderPhotoText(file)}'
          new='o.querySelector("[data-use-photo]").onclick=()=>{queueDraft(file,"photo",null);renderPhotoText(file)}'
          if old not in s: raise SystemExit('photo handoff anchor missing')
          s=s.replace(old,new,1)
          old='recorder=null;chunks=[];saveDraft(file,"video",meta).then(()=>renderVideoText(file,meta,""))};'
          new='recorder=null;chunks=[];queueDraft(file,"video",meta);renderVideoText(file,meta,"")};'
          if old not in s: raise SystemExit('video handoff anchor missing')
          s=s.replace(old,new,1)
          old='async function saveDraft(file,kind,meta){const key=draftKey(),id=`stage-draft-v133::${key}`;await putDraft(id,file,kind,meta);const all=read(DRAFTS,{});all[key]={id,kind,meta,text:"",updatedAt:Date.now()};write(DRAFTS,all);persistRoute()}'
          new='function queueDraft(file,kind,meta){const key=draftKey(),id=`stage-draft-v133::${key}`,all=read(DRAFTS,{});all[key]={id,kind,meta,text:"",updatedAt:Date.now()};write(DRAFTS,all);persistRoute();pendingDraft=putDraft(id,file,kind,meta).catch(error=>{console.debug("Evia draft save",error)});return pendingDraft}'
          if old not in s: raise SystemExit('saveDraft anchor missing')
          s=s.replace(old,new,1)
          old='async function clearDraft(){if(!active)return;const all=read(DRAFTS,{}),key=draftKey(),d=all[key];if(d?.id)await deleteDraft(d.id).catch(()=>{});delete all[key];write(DRAFTS,all)}'
          new='async function clearDraft(){if(!active)return;if(pendingDraft){await pendingDraft.catch(()=>{});pendingDraft=null}const all=read(DRAFTS,{}),key=draftKey(),d=all[key];if(d?.id)await deleteDraft(d.id).catch(()=>{});delete all[key];write(DRAFTS,all)}'
          if old not in s: raise SystemExit('clearDraft anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          Path('assets/evia-version-v147.js').write_text('(()=>{"use strict";const meta=document.querySelector(\'meta[name="evia-app-version"]\');if(meta)meta.setAttribute("content","147");window.EviaAppVersion=147})();\n')

          p=Path('index.html'); s=p.read_text()
          s=s.replace('name="evia-app-version" content="146"','name="evia-app-version" content="147"')
          s=s.replace('./assets/evia-version-v146.js?v=146','./assets/evia-version-v147.js?v=147')
          s=s.replace('./assets/evia-staged-evidence-v132.js?v=146','./assets/evia-staged-evidence-v132.js?v=147')
          s=s.replace('./assets/evia-updater.js?v=146','./assets/evia-updater.js?v=147')
          p.write_text(s)

          for name in ['sw.js','public/sw.js']:
              p=Path(name); s=p.read_text()
              s=s.replace('// Evia v146 routes all visual evidence through the existing Evia prompted camera.','// Evia v147 makes photo/video draft persistence non-blocking; UI and capture behaviour are unchanged.')
              s=s.replace("evia-shell-v146","evia-shell-v147")
              s=s.replace('./assets/evia-version-v146.js','./assets/evia-version-v147.js')
              p.write_text(s)

          manifest={
            'version':'147',
            'title':'Faster camera save',
            'details':[
              'Photo Use photo moves to the explanation immediately while the safety draft saves in the background',
              'Video Finish recording moves to Video complete immediately while the safety draft saves in the background',
              'Final evidence saving and draft recovery remain intact',
              'No camera UI, prompts, menus, tiles, layouts or course data changed'
            ],
            'summary':'Evia v147 removes the wait after photo and video capture without changing the camera experience.',
            'changes':['Instant photo handoff','Instant video handoff','Background draft persistence','Nothing else changed']
          }
          text=json.dumps(manifest,indent=2)+'\n'
          Path('update.json').write_text(text);Path('public/update.json').write_text(text)
          PY

      - name: Verify save-speed-only release
        run: |
          node --check assets/evia-staged-evidence-v132.js
          node --check assets/evia-version-v147.js
          node --check sw.js
          node --check public/sw.js
          test "$(git hash-object assets/evia-staged-evidence-v132.css)" = "d4f040b3be38c59d36f25f0c8e39525119011227"
          test "$(git hash-object assets/evia-stage-save-v139.js)" = "72c4f3c6dca2b88fe4b14b804ece2441ab81cb89"
          test "$(git hash-object assets/evia-photo-fast-v140.js)" = "da8b78b029069280f6b734afb5c33b5d1bd5bcc4"
          test "$(git hash-object assets/evia-selfobs-live.js)" = "6254b425d4ce0771ea79f8d3ca16b62824d66542"
          grep -q 'const VERSION=147' assets/evia-staged-evidence-v132.js
          grep -q 'queueDraft(file,"photo",null);renderPhotoText(file)' assets/evia-staged-evidence-v132.js
          grep -q 'queueDraft(file,"video",meta);renderVideoText(file,meta,"")' assets/evia-staged-evidence-v132.js
          ! grep -q 'await saveDraft(file,"photo"' assets/evia-staged-evidence-v132.js
          ! grep -q 'saveDraft(file,"video",meta).then' assets/evia-staged-evidence-v132.js
          grep -q 'name="evia-app-version" content="147"' index.html
          grep -q 'evia-staged-evidence-v132.js?v=147' index.html
          grep -q 'evia-stage-save-v139.js?v=139' index.html
          grep -q 'evia-photo-fast-v140.js?v=140' index.html
          grep -q 'evia-selfobs-live.js?v=145' index.html
          grep -q 'evia-shell-v147' sw.js
          grep -q 'evia-shell-v147' public/sw.js
          cmp -s sw.js public/sw.js
          node - <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('update.json','utf8')),b=JSON.parse(fs.readFileSync('public/update.json','utf8'));
          if(a.version!=='147'||JSON.stringify(a)!==JSON.stringify(b))throw Error('manifest mismatch');
          NODE
          node --test tests/next-visit-v95.test.mjs tests/update-notice-v96.test.mjs tests/milos-review-sync-v97.test.mjs tests/performance-current.test.mjs

      - name: Commit v147 and remove installer
        run: |
          rm .github/workflows/apply-v147-media-handoff-speed.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release Evia v147 faster camera save'
          git push
