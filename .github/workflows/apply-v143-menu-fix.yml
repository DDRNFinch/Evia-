name: Apply Evia v143 menu fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wire v143 single-panel fade only
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p=Path('index.html'); s=p.read_text()
          s=s.replace('name="evia-app-version" content="142"','name="evia-app-version" content="143"')
          s=s.replace('./assets/evia-version-v142.js?v=142','./assets/evia-version-v143.js?v=143')
          s=s.replace('./assets/evia-menu-fade-v142.js?v=142','./assets/evia-menu-fade-v143.js?v=143')
          s=s.replace('./assets/evia-updater.js?v=142','./assets/evia-updater.js?v=143')
          p.write_text(s)

          for name in ['sw.js','public/sw.js']:
              p=Path(name); s=p.read_text()
              s=s.replace("evia-shell-v142","evia-shell-v143")
              s=s.replace("./assets/evia-version-v142.js","./assets/evia-version-v143.js")
              s=s.replace("./assets/evia-menu-fade-v142.js","./assets/evia-menu-fade-v143.js")
              lines=s.splitlines()
              if lines and lines[0].startswith('// Evia v'):
                  lines[0]='// Evia v143 removes cloned menu transitions and keeps the approved app behaviour unchanged.'
                  s='\n'.join(lines)+'\n'
              p.write_text(s)

          manifest={
            'version':'143',
            'title':'Menu transition repaired',
            'details':[
              'Removed the cloned menu layer that caused duplicate and misplaced Evia UI',
              'Menu clicks now run normally with no delay or interception',
              'Only the newly rendered menu receives a brief subtle opacity fade',
              'Camera, photo speed, video prompts, timestamps, saving, course tiles and layouts are unchanged'
            ],
            'summary':'Evia v143 repairs the menu transition without changing the working app.',
            'changes':['Removed cloned menu transition','Restored normal immediate navigation','Added subtle single-panel fade','Everything else unchanged']
          }
          text=json.dumps(manifest,indent=2)+'\n'
          Path('update.json').write_text(text);Path('public/update.json').write_text(text)

          p=Path('.github/workflows/verify-evidence-v136.yml'); s=p.read_text()
          s=s.replace('name: Verify Evia menu fade v142','name: Verify Evia menu fade v143')
          s=s.replace('verify-v142:','verify-v143:')
          s=s.replace('node --check assets/evia-menu-fade-v142.js','node --check assets/evia-menu-fade-v143.js')
          s=s.replace('node --check assets/evia-version-v142.js','node --check assets/evia-version-v143.js')
          s=s.replace("const fade=fs.readFileSync('assets/evia-menu-fade-v142.js','utf8');","const fade=fs.readFileSync('assets/evia-menu-fade-v143.js','utf8');")
          s=s.replace("for(const x of ['mode:\"immediate-crossfade\"','ghostOf(panel)','cloneNode(true)','requestAnimationFrame','opacity'])if(!fade.includes(x))throw Error('Immediate cross-fade requirement missing: '+x);","for(const x of ['mode:\"immediate-single-panel-fade\"','queueMicrotask','requestAnimationFrame','panel.animate','START_OPACITY=.82'])if(!fade.includes(x))throw Error('Single-panel fade requirement missing: '+x);")
          s=s.replace("for(const bad of ['preventDefault()','stopPropagation()','stopImmediatePropagation()','setTimeout(()=>{','button.click()'])if(fade.includes(bad))throw Error('Fade must not block or delay normal navigation: '+bad);","for(const bad of ['preventDefault()','stopPropagation()','stopImmediatePropagation()','cloneNode','ghostOf(','document.body.appendChild','button.click()'])if(fade.includes(bad))throw Error('Fade must not clone, block or drive navigation: '+bad);")
          s=s.replace('Check v142 release wiring','Check v143 release wiring')
          s=s.replace('content="142"','content="143"')
          s=s.replace('evia-menu-fade-v142.js?v=142','evia-menu-fade-v143.js?v=143')
          s=s.replace('evia-version-v142.js?v=142','evia-version-v143.js?v=143')
          s=s.replace('evia-updater.js?v=142','evia-updater.js?v=143')
          s=s.replace('evia-shell-v142','evia-shell-v143')
          s=s.replace('window.EviaAppVersion=142','window.EviaAppVersion=143')
          s=s.replace("./assets/evia-menu-fade-v142.js' sw.js","./assets/evia-menu-fade-v143.js' sw.js")
          s=s.replace("a.version!=='142'","a.version!=='143'")
          s=s.replace('update.json is not v142','update.json is not v143')
          p.write_text(s)
          PY
      - name: Verify no working behaviour changed
        run: |
          node --check assets/evia-menu-fade-v143.js
          node --check assets/evia-version-v143.js
          node --check assets/evia-photo-fast-v140.js
          node --check assets/evia-staged-evidence-v132.js
          node --check assets/evia-stage-save-v139.js
          node --check sw.js
          node --check public/sw.js
          test "$(git hash-object assets/evia-staged-evidence-v132.css)" = "d4f040b3be38c59d36f25f0c8e39525119011227"
          test "$(git hash-object assets/evia-staged-evidence-v132.js)" = "31e544a5ccd5b009efe652ecadec1bcd13b5dcc5"
          test "$(git hash-object assets/evia-stage-save-v139.js)" = "72c4f3c6dca2b88fe4b14b804ece2441ab81cb89"
          test "$(git hash-object assets/evia-photo-fast-v140.js)" = "da8b78b029069280f6b734afb5c33b5d1bd5bcc4"
          node - <<'NODE'
          const fs=require('fs');
          const fade=fs.readFileSync('assets/evia-menu-fade-v143.js','utf8');
          for(const x of ['mode:"immediate-single-panel-fade"','queueMicrotask','requestAnimationFrame','panel.animate','START_OPACITY=.82'])if(!fade.includes(x))throw Error('Missing safe fade behaviour: '+x);
          for(const bad of ['preventDefault()','stopPropagation()','stopImmediatePropagation()','cloneNode','ghostOf(','document.body.appendChild','button.click()'])if(fade.includes(bad))throw Error('Unsafe transition behaviour remains: '+bad);
          const index=fs.readFileSync('index.html','utf8');
          for(const x of ['name="evia-app-version" content="143"','evia-photo-fast-v140.js?v=140','evia-menu-fade-v143.js?v=143','evia-staged-evidence-v132.js?v=138','evia-stage-save-v139.js?v=139','evia-version-v143.js?v=143','evia-updater.js?v=143'])if(!index.includes(x))throw Error('Release wiring missing '+x);
          const a=JSON.parse(fs.readFileSync('update.json','utf8')),b=JSON.parse(fs.readFileSync('public/update.json','utf8'));
          if(a.version!=='143'||JSON.stringify(a)!==JSON.stringify(b))throw Error('Manifest mismatch');
          if(fs.readFileSync('sw.js','utf8').trimEnd()!==fs.readFileSync('public/sw.js','utf8').trimEnd())throw Error('Service workers differ');
          NODE
          node --test tests/next-visit-v95.test.mjs tests/update-notice-v96.test.mjs tests/milos-review-sync-v97.test.mjs tests/performance-current.test.mjs
      - name: Commit v143 wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js public/sw.js update.json public/update.json .github/workflows/verify-evidence-v136.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Release Evia v143 safe menu fade'
          git push
