name: Apply Evia v145 core menu fade

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Protect working camera and evidence flow
        run: |
          test "$(git hash-object assets/evia-staged-evidence-v132.css)" = "d4f040b3be38c59d36f25f0c8e39525119011227"
          test "$(git hash-object assets/evia-staged-evidence-v132.js)" = "31e544a5ccd5b009efe652ecadec1bcd13b5dcc5"
          test "$(git hash-object assets/evia-stage-save-v139.js)" = "72c4f3c6dca2b88fe4b14b804ece2441ab81cb89"
          test "$(git hash-object assets/evia-photo-fast-v140.js)" = "da8b78b029069280f6b734afb5c33b5d1bd5bcc4"
          test "$(git hash-object assets/evia-selfobs-live.js)" = "a52e7ef99d6ae8e988e1be0d1c86f44952f5b32b"

      - name: Put fade inside Evia renderer
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          core=Path('assets/evia-selfobs-live.js')
          s=core.read_text()
          old='function render(){const p=$(".self-panel");if(!p||!open)return;if(view==="home")home(p);else if(view==="jobs")jobs(p);else if(view==="opps")opps(p);else if(view==="capture")capture(p);else if(view==="question")question(p);else if(view==="answer")answer(p);else if(view==="evidence")evidence(p);else if(view==="coverage")coverage(p);else if(view==="day")day(p);bindPanel()}'
          new='''function render(){const p=$(".self-panel");if(!p||!open)return;if(view==="home")home(p);else if(view==="jobs")jobs(p);else if(view==="opps")opps(p);else if(view==="capture")capture(p);else if(view==="question")question(p);else if(view==="answer")answer(p);else if(view==="evidence")evidence(p);else if(view==="coverage")coverage(p);else if(view==="day")day(p);bindPanel()}\nconst MENU_OUT_MS=80,MENU_IN_MS=150,MENU_LOW=.08,MENU_OUT_EASE="cubic-bezier(.4,0,.8,1)",MENU_IN_EASE="cubic-bezier(.16,1,.3,1)";\nlet menuAnimation=null,menuTransitioning=false;\nfunction menuTransition(change){\n  const p=$(".self-panel"),stage=$(".menu-stage");\n  if(!p||!open||stage?.classList.contains("evia-stage-managed-v132")||window.matchMedia?.("(prefers-reduced-motion: reduce)")?.matches){change();render();return}\n  if(menuTransitioning)return;\n  menuTransitioning=true;p.style.pointerEvents="none";\n  const swap=()=>{\n    change();render();p.style.opacity=String(MENU_LOW);\n    if(typeof p.animate!=="function"){p.style.transition=`opacity ${MENU_IN_MS}ms ${MENU_IN_EASE}`;requestAnimationFrame(()=>p.style.opacity="1");setTimeout(()=>{p.style.removeProperty("opacity");p.style.removeProperty("transition");p.style.removeProperty("pointer-events");menuTransitioning=false},MENU_IN_MS+25);return}\n    menuAnimation=p.animate([{opacity:MENU_LOW},{opacity:1}],{duration:MENU_IN_MS,easing:MENU_IN_EASE,fill:"forwards"});\n    const done=()=>{p.style.removeProperty("opacity");p.style.removeProperty("pointer-events");menuAnimation=null;menuTransitioning=false};menuAnimation.onfinish=done;menuAnimation.oncancel=done\n  };\n  if(typeof p.animate!=="function"){p.style.transition=`opacity ${MENU_OUT_MS}ms ${MENU_OUT_EASE}`;p.style.opacity=String(MENU_LOW);setTimeout(swap,MENU_OUT_MS);return}\n  menuAnimation=p.animate([{opacity:1},{opacity:MENU_LOW}],{duration:MENU_OUT_MS,easing:MENU_OUT_EASE,fill:"forwards"});menuAnimation.onfinish=swap;menuAnimation.oncancel=swap\n}'''
          if old not in s: raise SystemExit('render anchor not found')
          s=s.replace(old,new,1)

          old='''function bindPanel(){\n  document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{cat=findCat(b.dataset.cat);view="jobs";render()});\n  document.querySelectorAll("[data-job]").forEach(b=>b.onclick=()=>{job=findJob(cat,b.dataset.job);view="opps";render()});\n  document.querySelectorAll("[data-opp]").forEach(b=>b.onclick=()=>{opp=findOpp(job,b.dataset.opp);clearCapture();view=opp.media==="talk"?"question":"capture";render()});\n  document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;view="answer";render()});\n  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});\n  document.querySelectorAll("[data-code]").forEach(b=>b.onclick=()=>routeCode(b.dataset.code));\n  document.querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>action(b.dataset.action));\n  const pick=$("[data-pick]");if(pick)pick.onclick=()=>$("#selfPhoto").click();\n  const ta=$("#selfText");if(ta)ta.oninput=e=>typed=e.target.value\n}'''
          new='''function bindPanel(){\n  document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>menuTransition(()=>{cat=findCat(b.dataset.cat);view="jobs"}));\n  document.querySelectorAll("[data-job]").forEach(b=>b.onclick=()=>menuTransition(()=>{job=findJob(cat,b.dataset.job);view="opps"}));\n  document.querySelectorAll("[data-opp]").forEach(b=>b.onclick=()=>{opp=findOpp(job,b.dataset.opp);clearCapture();view=opp.media==="talk"?"question":"capture";render()});\n  document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;view="answer";render()});\n  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>menuTransition(()=>{tab=b.dataset.tab}));\n  document.querySelectorAll("[data-code]").forEach(b=>b.onclick=()=>routeCode(b.dataset.code));\n  document.querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>action(b.dataset.action));\n  const pick=$("[data-pick]");if(pick)pick.onclick=()=>$("#selfPhoto").click();\n  const ta=$("#selfText");if(ta)ta.oninput=e=>typed=e.target.value\n}'''
          if old not in s: raise SystemExit('bindPanel anchor not found')
          s=s.replace(old,new,1)

          old='function goBack(){if(view==="jobs")view="home";else if(view==="opps")view="jobs";else if(view==="capture"||view==="question")view="opps";else if(view==="answer")view="question";else view="home";render()}'
          new='''function goBack(){const current=view,change=()=>{if(current==="jobs")view="home";else if(current==="opps")view="jobs";else if(current==="capture"||current==="question")view="opps";else if(current==="answer")view="question";else view="home"};if(current==="jobs"||current==="opps"||current==="evidence"||current==="coverage")menuTransition(change);else{change();render()}}'''
          if old not in s: raise SystemExit('goBack anchor not found')
          s=s.replace(old,new,1)

          s=s.replace('else if(a==="home"){view="home";render()}','else if(a==="home")menuTransition(()=>{view="home"})',1)
          s=s.replace('else if(a==="evidence"){view="evidence";render()}','else if(a==="evidence")menuTransition(()=>{view="evidence"})',1)
          s=s.replace('else if(a==="coverage"){view="coverage";render()}','else if(a==="coverage")menuTransition(()=>{view="coverage"})',1)
          core.write_text(s)

          p=Path('index.html'); s=p.read_text()
          s=s.replace('name="evia-app-version" content="143"','name="evia-app-version" content="145"')
          s=s.replace('./assets/evia-selfobs-live.js?v=133','./assets/evia-selfobs-live.js?v=145')
          s=s.replace('./assets/evia-version-v143.js?v=143','./assets/evia-version-v145.js?v=145')
          s=s.replace('<script defer src="./assets/evia-menu-fade-v143.js?v=143"></script>\n','')
          s=s.replace('./assets/evia-updater.js?v=143','./assets/evia-updater.js?v=145')
          p.write_text(s)

          for name in ['sw.js','public/sw.js']:
              p=Path(name); s=p.read_text()
              s=s.replace('// Evia v143 removes cloned menu transitions and keeps the approved app behaviour unchanged.','// Evia v145 moves menu fading into the core renderer and keeps evidence capture isolated.')
              s=s.replace('evia-shell-v143','evia-shell-v145')
              s=s.replace('./assets/evia-version-v143.js','./assets/evia-version-v145.js')
              s=s.replace("  './assets/evia-menu-fade-v143.js',\n",'')
              p.write_text(s)

          manifest={
            'version':'145',
            'title':'Core menu transition repair',
            'details':[
              'Removed the external menu fade layer completely',
              'Normal menu pages now fade out and fade in from inside Evia own renderer',
              'Evidence tasks and camera routes are excluded from menu animation',
              'The existing camera, video prompts, timestamps, photo speed and save flow are unchanged'
            ],
            'summary':'Evia v145 restores the cameras and moves menu fading into the correct core navigation path.',
            'changes':['Restore isolated camera flow','Core-only menu fade','No external transition script','Everything else unchanged']
          }
          text=json.dumps(manifest,indent=2)+'\n';Path('update.json').write_text(text);Path('public/update.json').write_text(text)
          PY

      - name: Verify core transition and cameras
        run: |
          node --check assets/evia-selfobs-live.js
          node --check assets/evia-staged-evidence-v132.js
          node --check assets/evia-stage-save-v139.js
          node --check assets/evia-photo-fast-v140.js
          node --check assets/evia-version-v145.js
          node --check sw.js
          node --check public/sw.js
          test "$(git hash-object assets/evia-staged-evidence-v132.css)" = "d4f040b3be38c59d36f25f0c8e39525119011227"
          test "$(git hash-object assets/evia-staged-evidence-v132.js)" = "31e544a5ccd5b009efe652ecadec1bcd13b5dcc5"
          test "$(git hash-object assets/evia-stage-save-v139.js)" = "72c4f3c6dca2b88fe4b14b804ece2441ab81cb89"
          test "$(git hash-object assets/evia-photo-fast-v140.js)" = "da8b78b029069280f6b734afb5c33b5d1bd5bcc4"
          grep -q 'function menuTransition(change)' assets/evia-selfobs-live.js
          grep -q 'MENU_OUT_MS=80,MENU_IN_MS=150' assets/evia-selfobs-live.js
          grep -q 'document.querySelectorAll("\[data-opp\]").forEach(b=>b.onclick=()=>{opp=findOpp' assets/evia-selfobs-live.js
          ! grep -q 'evia-menu-fade' index.html
          grep -q 'evia-selfobs-live.js?v=145' index.html
          grep -q 'evia-staged-evidence-v132.js?v=138' index.html
          grep -q 'evia-stage-save-v139.js?v=139' index.html
          grep -q 'evia-photo-fast-v140.js?v=140' index.html
          grep -q 'name="evia-app-version" content="145"' index.html
          grep -q 'evia-version-v145.js?v=145' index.html
          grep -q 'evia-shell-v145' sw.js
          grep -q 'evia-shell-v145' public/sw.js
          ! grep -q 'evia-menu-fade' sw.js
          ! grep -q 'evia-menu-fade' public/sw.js
          node - <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('update.json','utf8')),b=JSON.parse(fs.readFileSync('public/update.json','utf8'));
          if(a.version!=='145'||JSON.stringify(a)!==JSON.stringify(b))throw Error('v145 manifest mismatch');
          if(fs.readFileSync('sw.js','utf8').trimEnd()!==fs.readFileSync('public/sw.js','utf8').trimEnd())throw Error('service workers differ');
          NODE
          node --test tests/next-visit-v95.test.mjs tests/update-notice-v96.test.mjs tests/milos-review-sync-v97.test.mjs tests/performance-current.test.mjs

      - name: Install permanent v145 verification
        run: |
          cat > .github/workflows/verify-evidence-v136.yml <<'EOF'
          name: Verify Evia v145 core navigation
          on:
            push:
              branches: [main]
            pull_request:
              branches: [main]
            workflow_dispatch:
          permissions:
            contents: read
          jobs:
            verify-v145:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                - name: Verify core fade and protected capture
                  run: |
                    node --check assets/evia-selfobs-live.js
                    node --check assets/evia-staged-evidence-v132.js
                    node --check assets/evia-stage-save-v139.js
                    node --check assets/evia-photo-fast-v140.js
                    node --check assets/evia-version-v145.js
                    test "$(git hash-object assets/evia-staged-evidence-v132.css)" = "d4f040b3be38c59d36f25f0c8e39525119011227"
                    test "$(git hash-object assets/evia-staged-evidence-v132.js)" = "31e544a5ccd5b009efe652ecadec1bcd13b5dcc5"
                    test "$(git hash-object assets/evia-stage-save-v139.js)" = "72c4f3c6dca2b88fe4b14b804ece2441ab81cb89"
                    test "$(git hash-object assets/evia-photo-fast-v140.js)" = "da8b78b029069280f6b734afb5c33b5d1bd5bcc4"
                    grep -q 'function menuTransition(change)' assets/evia-selfobs-live.js
                    grep -q 'MENU_OUT_MS=80,MENU_IN_MS=150' assets/evia-selfobs-live.js
                    ! grep -q 'evia-menu-fade' index.html
                    grep -q 'evia-selfobs-live.js?v=145' index.html
                    grep -q 'evia-staged-evidence-v132.js?v=138' index.html
                    grep -q 'evia-stage-save-v139.js?v=139' index.html
                    grep -q 'evia-photo-fast-v140.js?v=140' index.html
                    grep -q 'evia-shell-v145' sw.js
                    node --test tests/next-visit-v95.test.mjs tests/update-notice-v96.test.mjs tests/milos-review-sync-v97.test.mjs tests/performance-current.test.mjs
          EOF

      - name: Commit v145 and remove installer
        run: |
          rm -f .github/workflows/apply-v145-core-fade.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/evia-selfobs-live.js index.html sw.js public/sw.js update.json public/update.json .github/workflows/verify-evidence-v136.yml .github/workflows/apply-v145-core-fade.yml
          git commit -m 'Release Evia v145 core menu fade and restore cameras'
          git push
