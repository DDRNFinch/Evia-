# Trigger exact mirror
name: Mirror current Evia into Evia_beta

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mirror-current-evia.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Evia_beta
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Clone current Evia
        run: git clone --depth 1 --branch main https://github.com/DDRNFinch/Evia.git /tmp/evia-source

      - name: Replace Evia_beta with Evia exactly
        shell: bash
        run: |
          rsync -a --delete --exclude='.git/' /tmp/evia-source/ ./
          git status --short

      - name: Commit exact mirror
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Evia_beta already matches Evia.'
          else
            git commit -m 'Copy all current Evia files into Evia_beta'
            git push origin HEAD:main
          fi
