name: Temporary verify Evia v140
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify v140
        run: |
          node --check assets/evia-staged-evidence-v132.js
          node --check assets/evia-stage-save-v139.js
          node --check assets/evia-photo-fast-v140.js
          node --check assets/evia-menu-fade-v140.js
          node --check assets/evia-version-v140.js
          node --check sw.js
          node --check public/sw.js
          test "$(git hash-object assets/evia-staged-evidence-v132.css)" = "d4f040b3be38c59d36f25f0c8e39525119011227"
          test "$(git hash-object assets/evia-staged-evidence-v132.js)" = "31e544a5ccd5b009efe652ecadec1bcd13b5dcc5"
          test "$(git hash-object assets/evia-stage-save-v139.js)" = "72c4f3c6dca2b88fe4b14b804ece2441ab81cb89"
          grep -q 'name="evia-app-version" content="140"' index.html
          grep -q 'evia-photo-fast-v140.js?v=140' index.html
          grep -q 'evia-menu-fade-v140.js?v=140' index.html
          grep -q 'evia-staged-evidence-v132.js?v=138' index.html
          grep -q 'evia-stage-save-v139.js?v=139' index.html
          grep -q 'evia-version-v140.js?v=140' index.html
          grep -q 'evia-updater.js?v=140' index.html
          grep -q "evia-shell-v140" sw.js
          grep -q "evia-shell-v140" public/sw.js
          node - <<'NODE'
          const fs=require('fs');
          const fast=fs.readFileSync('assets/evia-photo-fast-v140.js','utf8');
          const fade=fs.readFileSync('assets/evia-menu-fade-v140.js','utf8');
          const index=fs.readFileSync('index.html','utf8');
          for(const x of ['.evia-stage-overlay-v132.evia-photo-mode-v137','longest<=1280','const scale=1280/longest','maxLongEdge:1280'])if(!fast.includes(x))throw Error('fast photo missing '+x);
          for(const bad of ['MediaRecorder','data-next-prompt','data-finish-video','evia-video-mode-v137'])if(fast.includes(bad))throw Error('fast photo touched video '+bad);
          for(const x of ['[data-cat]','[data-job]','[data-opp]','opacity 95ms ease','opacity 170ms ease','prefers-reduced-motion'])if(!fade.includes(x))throw Error('fade missing '+x);
          if(index.indexOf('evia-menu-fade-v140.js?v=140')>index.indexOf('evia-staged-evidence-v132.js?v=138'))throw Error('fade load order wrong');
          const a=JSON.parse(fs.readFileSync('update.json','utf8')),b=JSON.parse(fs.readFileSync('public/update.json','utf8'));
          if(a.version!=='140'||JSON.stringify(a)!==JSON.stringify(b))throw Error('manifest mismatch');
          if(fs.readFileSync('sw.js','utf8').trimEnd()!==fs.readFileSync('public/sw.js','utf8').trimEnd())throw Error('service workers differ');
          NODE
          node --test tests/next-visit-v95.test.mjs tests/update-notice-v96.test.mjs tests/milos-review-sync-v97.test.mjs tests/performance-current.test.mjs
          python - <<'PY'
          from pathlib import Path
          import re,sys
          index=Path('index.html').read_text(encoding='utf-8');missing=[]
          for raw in re.findall(r'(?:src|href)=["\']([^"\']+)["\']',index):
              path=raw.split('?',1)[0]
              if path.startswith('./'): local=Path(path[2:])
              else: continue
              if not local.exists(): missing.append(str(local))
          if missing: print(missing);sys.exit(1)
          PY
      - name: Record pass
        run: |
          mkdir -p .github/verification
          printf 'Evia v140 photo speed and menu fade verification passed.\n' > .github/verification/v140-polish-passed.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/verification/v140-polish-passed.txt
          git commit -m 'Verify Evia v140 performance polish'
          git push
